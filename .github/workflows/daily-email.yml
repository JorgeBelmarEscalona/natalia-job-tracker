name: Resumen diario por correo

on:
  schedule:
    # 12:00 UTC ~ 08:00-09:00 hora de Santiago (ajustar si hace falta)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo probar la búsqueda: no envía correo ni guarda cambios"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/ofertas.json"

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar ofertas nuevas
        run: python3 scripts/buscar_ofertas.py

      - name: Enviar resumen
        if: ${{ !inputs.dry_run }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NATALIA_EMAIL: ${{ secrets.NATALIA_EMAIL }}
        run: python3 scripts/send_digest.py

      - name: Mostrar resultado de la prueba
        if: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json
          for o in json.load(open("data/ofertas.json")):
              print(o["fecha"], "|", o["cargo"], "|", o["empresa"], "|", o["comuna"], "|", o["link"])
          PY

      - name: Guardar ofertas nuevas y registro de notificaciones
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/ofertas.json data/.notified.json; then
            git add data/ofertas.json data/.notified.json
            git commit -m "feat: agregar ofertas nuevas detectadas (control de gestión / finanzas, RM)"
            git push
          fi
